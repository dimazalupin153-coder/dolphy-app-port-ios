name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install xcodegen
      run: brew install xcodegen
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build
      run: |
        set -o pipefail
        xcodebuild -project DolphyCam.xcodeproj -scheme DolphyCam \
          -sdk iphoneos -configuration Release \
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
    - name: Package IPA
      run: |
        mkdir Payload
        cp -r build/Build/Products/Release-iphoneos/DolphyCam.app Payload/
        zip -r DolphyCam.ipa Payload
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DolphyCam-ipa
        path: DolphyCam.ipa
