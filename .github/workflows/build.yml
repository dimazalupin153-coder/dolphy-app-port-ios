name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install xcodegen
      run: brew install xcodegen
    - name: Prepare icon
      run: |
        if [ -f DolphyCam/AppIcon.png ]; then
          sips -z 1024 1024 DolphyCam/AppIcon.png --out DolphyCam/AppIcon.png || true
          sips -z 60 60 DolphyCam/AppIcon.png --out DolphyCam/AppIcon60.png || true
          sips -z 120 120 DolphyCam/AppIcon.png --out DolphyCam/AppIcon120.png || true
          sips -z 180 180 DolphyCam/AppIcon.png --out DolphyCam/AppIcon180.png || true
        fi
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build
      run: |
        set -o pipefail
        xcodebuild -project DolphyCam.xcodeproj -scheme DolphyCam \
          -sdk iphoneos -configuration Release \
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
    - name: Package IPA
      run: |
        mkdir Payload
        cp -r build/Build/Products/Release-iphoneos/DolphyCam.app Payload/
        zip -r DolphyCam.ipa Payload
    - name: Show size
      run: |
        ls -lh DolphyCam.ipa
        du -sh Payload/DolphyCam.app
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DolphyCam-ipa
        path: DolphyCam.ipa
